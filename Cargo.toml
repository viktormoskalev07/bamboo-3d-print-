[package]
name = "bambu-plotter"
version = "1.0.0"
edition = "2021"
description = "Pen plotter studio for Bambu Lab A1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ttf-parser = "0.25"
csv = "1"
usvg = "0.45"
zip = { version = "2", default-features = false, features = ["deflate"] }
md5 = "0.7"
png = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
arboard = "3"

[profile.release]
opt-level = 3
strip = true
